name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Required for npm provenance: the published package is signed with a
      # verifiable link back to the commit and workflow that built it.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Create release PR or publish
        uses: changesets/action@v2
        with:
          version-script: pnpm changeset version
          # Publishing needs npm credentials. Until an NPM_TOKEN secret (or trusted
          # publishing) exists, this step only opens the version PR; publishing is
          # done locally with `pnpm changeset publish`. The moment the secret exists,
          # publishing from CI turns itself on.
          publish-script: ${{ secrets.NPM_TOKEN != '' && 'pnpm changeset publish' || '' }}
          commit-message: "chore: release"
          pr-title: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
