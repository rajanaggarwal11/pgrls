version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # TypeScript 7 is out, but typescript-eslint refuses to load against it
      # ("typescript-eslint does not support TS 7.0") and tsup's declaration
      # build throws on it. Drop this entry once typescript-eslint ships TS 7
      # support; minor and patch bumps are unaffected.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # @types/node tracks the OLDEST Node this package supports, not the newest
      # published. Typing against a later major lets an API that does not exist on
      # the supported floor pass typecheck.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
